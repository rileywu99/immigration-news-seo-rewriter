name: Run Immigration News SEO Rewriter

on:
  workflow_dispatch: # manual trigger only — run from GitHub Actions tab when needed

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rewriter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS_JSON_STRING: ${{ secrets.GOOGLE_CREDENTIALS_JSON_STRING }}
          MAX_ARTICLES: 5
        run: python main.py
